<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DATAISM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  :root{ --glow:255,196,72; --g:1; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#060505}
  body{cursor:grab;user-select:none;touch-action:none;
    background:radial-gradient(ellipse at 50% 45%, #17130b 0%, #080706 55%, #020202 100%)}
  body.grabbing{cursor:grabbing}
  #stage{position:absolute;left:0;top:0;width:516px;height:1032px;transform-origin:0 0}
  #led{position:absolute;inset:0;width:516px;height:1032px;image-rendering:pixelated}
  /* cross-shaped mask so the canvas' empty corners stay transparent */
  .bloom{position:absolute;inset:0;pointer-events:none}
  .bloom i{position:absolute;background:rgb(var(--glow))}
  .bloom i.v{left:172px;top:0;width:172px;height:100%}
  .bloom i.hz{left:0;top:258px;width:100%;height:172px}
  .bloom.b1{filter:blur(8px);opacity:calc(.55*var(--g))}
  .bloom.b2{filter:blur(32px);opacity:calc(.35*var(--g))}
  .bloom.b3{filter:blur(95px);opacity:calc(.22*var(--g))}
  .bloom.b3 i.v{transform:scaleX(1.4)} .bloom.b3 i.hz{transform:scaleY(1.6)}
  /* LED pixel-dot simulation (each stage px = one LED) */
  #dots{position:absolute;inset:0;pointer-events:none;display:none;
    background-image:radial-gradient(circle at 50% 50%, transparent 0 34%, rgba(0,0,0,.92) 60%);
    background-size:1px 1px;
    -webkit-mask:linear-gradient(#000,#000) 172px 0/172px 100% no-repeat, linear-gradient(#000,#000) 0 258px/100% 172px no-repeat;
            mask:linear-gradient(#000,#000) 172px 0/172px 100% no-repeat, linear-gradient(#000,#000) 0 258px/100% 172px no-repeat}
  body.dots #dots{display:block}
  /* physical 172x86 panel boundaries */
  #panels{position:absolute;inset:0;pointer-events:none;display:none}
  #panels i{position:absolute;outline:calc(1px / var(--s,1)) solid rgba(255,196,72,.35)}
  body.grid #panels{display:block}
  /* raw mode: 1:1 native output for the LED controller */
  body.raw{background:#000}
  body.raw .bloom, body.raw #dots, body.raw #panels, body.raw #hud{display:none!important}
  #hud{position:fixed;left:16px;bottom:16px;font:10px/1.5 Galmuri9,monospace;color:#7a6a48;pointer-events:none;transition:opacity 1s}
</style>
</head>
<body>
<div id="stage">
  <div class="bloom b3"><i class="v"></i><i class="hz"></i></div>
  <div class="bloom b2"><i class="v"></i><i class="hz"></i></div>
  <div class="bloom b1"><i class="v"></i><i class="hz"></i></div>
  <canvas id="led" width="516" height="1032"></canvas>
  <div id="dots"></div>
  <div id="panels"></div>
</div>
<div id="hud">516×1032 · 16 panels (172×86)<br>F fit · L LED dots · G panel grid · R raw 1:1 · dbl-click zoom</div>

<script>
/* =====================================================================
   GEOMETRY — 1 unit = 86px.  Cross = 6u x 12u = 516 x 1032 px.
   Physical panel = 172 x 86. Arms use it landscape, the shaft portrait.
   ===================================================================== */
const U=86, W=U*6, H=U*12;
const SLOT = {                 // [x, y, w, h]
  status:  [2*U, 0,    U, 2*U],  commits: [3*U, 0,    U, 2*U],
  hfNew:   [2*U, 2*U,  U, 2*U],  hfTrend: [3*U, 2*U,  U, 2*U],
  bsky:    [0,   3*U,2*U,   U],  or:      [4*U, 3*U,2*U,   U],
  wiki:    [0,   4*U,2*U,   U],  grid:    [4*U, 4*U,2*U,   U],
  hn:      [2*U, 4*U,  U, 2*U],  ghList:  [3*U, 4*U,  U, 2*U],
  bsFeed:  [2*U, 6*U,  U, 6*U],  wkFeed:  [3*U, 6*U,  U, 6*U],
};
const PANELS = [];
for (const x of [2*U, 3*U]) for (let y=0; y<H; y+=2*U) PANELS.push([x,y,U,2*U]);
for (const x of [0, 4*U]) for (const y of [3*U, 4*U]) PANELS.push([x,y,2*U,U]);
document.getElementById('panels').innerHTML = PANELS.map(([x,y,w,h])=>`<i style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></i>`).join('');

/* ---------- palette & pixel fonts ---------- */
const C = { fg:'#f2efe6', dim:'#8a8170', faint:'#3d372c', y:'#ffc448', ok:'#3dff8a', warn:'#ffcc00', bad:'#ff3b3b', blue:'#7cc4ff' };
const FS  = '8px Galmuri7';          // 7px-tall pixel font, line 9
const FM  = '12px Galmuri11';
const FB  = 'bold 12px Galmuri11';
const FBIG= 'bold 24px Galmuri11';   // 2x bold for hero numbers
const LH = 9;

const cv = document.getElementById('led');
const ctx = cv.getContext('2d');
ctx.textBaseline = 'top';
ctx.imageSmoothingEnabled = false;

/* ---------- view: zoom / pan / modes ---------- */
const stage = document.getElementById('stage');
const view = { s:1, x:0, y:0 };
const FIT_PAD = 0.06;
const fitScale = () => Math.min(innerWidth/W, innerHeight/H) * (1 - FIT_PAD*2);
function apply(anim){
  stage.style.transition = anim ? 'transform .45s cubic-bezier(.2,.7,.2,1)' : 'none';
  stage.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
  stage.style.setProperty('--s', view.s);
}
function fit(anim){
  if (document.body.classList.contains('raw')) { view.s=1; view.x=0; view.y=0; return apply(); }
  const s=fitScale(); view.s=s; view.x=(innerWidth-W*s)/2; view.y=(innerHeight-H*s)/2; apply(anim);
}
function zoomAt(f,cx,cy,anim){ const s=Math.min(24,Math.max(fitScale()*0.8,view.s*f)), k=s/view.s; view.x=cx-(cx-view.x)*k; view.y=cy-(cy-view.y)*k; view.s=s; apply(anim); }
function focusRect([x,y,w,h]){ const s=Math.min(24, innerWidth*0.9/w, innerHeight*0.9/h); view.s=s; view.x=innerWidth/2-(x+w/2)*s; view.y=innerHeight/2-(y+h/2)*s; apply(true); }
addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)), e.clientX, e.clientY); }, {passive:false});
let drag=null;
addEventListener('pointerdown', e=>{ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; document.body.classList.add('grabbing'); });
addEventListener('pointermove', e=>{ if(!drag) return; view.x=drag.vx+e.clientX-drag.x; view.y=drag.vy+e.clientY-drag.y; apply(); });
addEventListener('pointerup', ()=>{ drag=null; document.body.classList.remove('grabbing'); });
addEventListener('dblclick', e=>{
  const px=(e.clientX-view.x)/view.s, py=(e.clientY-view.y)/view.s;
  const hit=Object.values(SLOT).find(([x,y,w,h])=>px>=x&&px<x+w&&py>=y&&py<y+h);
  hit ? focusRect(hit) : fit(true);
});
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase(), c=[innerWidth/2,innerHeight/2];
  if(k==='+'||k==='=') zoomAt(1.4,...c,true);
  else if(k==='-') zoomAt(1/1.4,...c,true);
  else if(k==='f'||k==='0'||k==='escape') fit(true);
  else if(k==='l') document.body.classList.toggle('dots');
  else if(k==='g') document.body.classList.toggle('grid');
  else if(k==='r'){ document.body.classList.toggle('raw'); fit(); }
});
addEventListener('resize', ()=>fit());
if (new URLSearchParams(location.search).has('raw')) document.body.classList.add('raw');
fit();
setTimeout(()=>document.getElementById('hud').style.opacity=0, 6000);

/* ---------- bloom breathing + flare ---------- */
let flare=0;

/* =====================================================================
   DATA  (same free public sources as index.html, written into state S)
   ===================================================================== */
const AI_RE = /\b(AI|A\.I\.|LLMs?|GPT[-\d\w]*|ChatGPT|OpenAI|Claude|Anthropic|Gemini|DeepSeek|Copilot|Grok|Llama|Mistral|Qwen|Nvidia|AGI|machine learning|neural|chatbot|인공지능|생성형|딥러닝|챗GPT|클로드)\b/i;
const S = {
  status:[], incidents:[], gh:{}, ghLines:[], hfNew:[], hfTrend:[],
  bs:{rate:0,total:0,pct:0,series:[],live:false}, wk:{rate:0,ai:0,series:[],live:false},
  or:{count:0,newest:[]}, grid:{val:null,idx:'',mix:[]}, hnLines:[], bsFeed:[], wkFeed:[], live:{}
};
async function getJSON(url){ const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(r.status); return r.json(); }
function every(ms, fn){ const run=()=>fn().then(()=>S.live[fn.name]=true).catch(e=>{S.live[fn.name]=false;console.warn(fn.name,e)}); run(); setInterval(run, ms); }
const ago = t => { const s=(Date.now()-new Date(t))/1000; if(s<60)return Math.max(0,s|0)+'s'; if(s<3600)return (s/60|0)+'m'; if(s<86400)return (s/3600|0)+'h'; return (s/86400|0)+'d'; };
const fmt = n => Math.round(n).toLocaleString('en-US');
const compact = n => n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':String(Math.round(n));

const STATUS = [
  ['OPENAI','https://status.openai.com/api/v2/summary.json'],
  ['CLAUDE','https://status.claude.com/api/v2/summary.json'],
  ['GITHUB','https://www.githubstatus.com/api/v2/summary.json'],
  ['CURSOR','https://status.cursor.com/api/v2/summary.json'],
  ['CLOUDFLR','https://www.cloudflarestatus.com/api/v2/summary.json'],
];
every(60000, async function status(){
  const res=await Promise.allSettled(STATUS.map(([,u])=>getJSON(u)));
  S.incidents=[];
  S.status=res.map((r,i)=>{
    const name=STATUS[i][0];
    if(r.status!=='fulfilled') return {name,ind:'na'};
    (r.value.incidents||[]).forEach(x=>S.incidents.push({name,text:x.name,impact:x.impact}));
    return {name,ind:r.value.status.indicator,down:r.value.components.filter(c=>c.status!=='operational').length};
  });
  S.incLines=[]; S.incidents.forEach(x=>{ S.incLines.push([{t:'▲ '+x.name,c:x.impact==='minor'?C.warn:C.bad}]); wrap(x.text, U-6, FS).forEach(l=>S.incLines.push(l)); S.incLines.push([]); });
});

async function ghCount(q,key){
  const j=await getJSON(`https://api.github.com/search/commits?q=${encodeURIComponent(q)}&sort=committer-date&order=desc&per_page=12`);
  const o=S.gh[key]||{}; S.gh[key]={prev:o.cur??j.total_count, cur:j.total_count, t:performance.now()};
  return j;
}
every(90000, async function github(){
  const j=await ghCount('"co-authored-by: claude"','claude');
  S.ghLines=[];
  j.items.forEach(it=>{
    S.ghLines.push([{t:ago(it.commit.committer.date)+' '+it.repository.name, c:C.dim}]);
    wrap(it.commit.message.split('\n')[0], U-6, FS).forEach(l=>S.ghLines.push(l));
    S.ghLines.push([]);
  });
  await new Promise(r=>setTimeout(r,4000));
  await ghCount('"co-authored-by: copilot"','copilot');
});

every(30000, async function hfNew(){
  const j=await getJSON('https://huggingface.co/api/models?sort=createdAt&direction=-1&limit=20');
  const seen=new Set(S.hfNew.map(m=>m.id));
  S.hfNew=j.map(m=>({id:m.id, name:m.id.split('/').pop(), created:m.createdAt, born:seen.size&&!seen.has(m.id)?performance.now():0}));
});
every(300000, async function hfTrend(){
  const j=await getJSON('https://huggingface.co/api/models?sort=trendingScore&direction=-1&limit=20');
  S.hfTrend=j.map(m=>({name:m.id.split('/').pop(), likes:m.likes||0}));
});
every(60000, async function hn(){
  const j=await getJSON('https://hn.algolia.com/api/v1/search_by_date?query=AI&tags=story&hitsPerPage=14');
  S.hnLines=[];
  j.hits.forEach(h=>{
    S.hnLines.push([{t:ago(h.created_at)+' ▲'+(h.points??0), c:C.dim}]);
    wrap(h.title, U-6, FS).forEach(l=>S.hnLines.push(l));
    S.hnLines.push([]);
  });
});
every(600000, async function openrouter(){
  const j=await getJSON('https://openrouter.ai/api/v1/models');
  S.or.count=j.data.length;
  S.or.newest=j.data.slice().sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,8).map(m=>m.name||m.id);
});
const FUEL_C={gas:'#ff7a45',coal:'#8c5a3c',nuclear:'#b07cff',wind:'#3dff8a',solar:'#ffd84a',hydro:'#4ab8ff',biomass:'#9acd32',imports:'#888',other:'#555'};
every(300000, async function grid(){
  const [i,g]=await Promise.all([getJSON('https://api.carbonintensity.org.uk/intensity'),getJSON('https://api.carbonintensity.org.uk/generation')]);
  const d=i.data[0].intensity;
  S.grid={val:d.actual??d.forecast, idx:(d.index||'').toUpperCase(), mix:g.data.generationmix.filter(f=>f.perc>0).sort((a,b)=>b.perc-a.perc)};
});

/* Bluesky Jetstream — realtime */
(function bluesky(){
  let total=0, ai=0, secAI=[], secT=[], lastFeed=0;
  function connect(){
    const ws=new WebSocket('wss://jetstream2.us-east.bsky.network/subscribe?wantedCollections=app.bsky.feed.post');
    ws.onopen=()=>S.bs.live=true;
    ws.onclose=()=>{ S.bs.live=false; setTimeout(connect,3000); };
    ws.onmessage=e=>{
      const m=JSON.parse(e.data);
      if(m.kind!=='commit'||m.commit?.operation!=='create') return;
      const t=m.commit.record?.text; if(!t) return;
      total++;
      if(AI_RE.test(t)){
        ai++; flare+=0.12;
        const now=performance.now();
        if(now-lastFeed>1500){ lastFeed=now; pushFeed(S.bsFeed, wrap(t.replace(/\s+/g,' ').slice(0,200), U-6, FS)); }
      }
    };
  }
  connect();
  setInterval(()=>{
    secAI.push(ai); secT.push(total); ai=0; total=0;
    if(secAI.length>60){ secAI.shift(); secT.shift(); }
    const a=secAI.reduce((x,y)=>x+y,0), t=secT.reduce((x,y)=>x+y,0);
    S.bs.rate=Math.round(a*60/secAI.length); S.bs.total=Math.round(t*60/secT.length); S.bs.pct=t?a/t*100:0;
    S.bs.series.push(S.bs.rate); if(S.bs.series.length>200) S.bs.series.shift();
  },1000);
})();

/* Wikipedia EventStreams — realtime */
(function wiki(){
  let n=0, lastFeed=0;
  function connect(){
    const es=new EventSource('https://stream.wikimedia.org/v2/stream/recentchange');
    es.onopen=()=>S.wk.live=true;
    es.onerror=()=>S.wk.live=false;
    es.onmessage=e=>{
      const d=JSON.parse(e.data);
      if(d.type!=='edit'||d.bot) return;
      n++;
      const isAI=AI_RE.test(d.title); if(isAI) S.wk.ai++;
      const now=performance.now();
      if(isAI || now-lastFeed>1200){
        lastFeed=now;
        const delta=(d.length?.new??0)-(d.length?.old??0);
        const lines=wrap(d.title, U-6, FS);
        lines.unshift([{t:d.wiki.replace('wiki',''),c:C.blue},{t:(delta>=0?'+':'')+delta,c:delta>=0?C.ok:C.bad}]);
        pushFeed(S.wkFeed, lines);
      }
    };
  }
  connect();
  setInterval(()=>{ S.wk.rate=n; S.wk.series.push(n); if(S.wk.series.length>200) S.wk.series.shift(); n=0; },1000);
})();

function pushFeed(arr, lines){ arr.unshift({lines, born:performance.now()}); if(arr.length>40) arr.pop(); }

/* =====================================================================
   TEXT LAYOUT (pixel-font aware)
   A "line" is an array of tokens {t, c?, hl?}
   ===================================================================== */
function wrap(text, maxW, f){
  ctx.font=f;
  const sp=ctx.measureText(' ').width, lines=[]; let line=[], lw=0;
  for (let w of String(text).split(/\s+/).filter(Boolean)){
    let ww=ctx.measureText(w).width;
    while (ww>maxW){                         // hard-break long words / CJK runs
      let i=1; while(i<w.length && ctx.measureText(w.slice(0,i+1)).width<=maxW) i++;
      if(line.length){ lines.push(line); line=[]; lw=0; }
      lines.push([{t:w.slice(0,i), hl:AI_RE.test(w)}]); w=w.slice(i); ww=ctx.measureText(w).width;
    }
    if(!w) continue;
    const add=(line.length?sp:0)+ww;
    if(lw+add>maxW && line.length){ lines.push(line); line=[]; lw=0; }
    line.push({t:w, hl:AI_RE.test(w)}); lw+=(line.length>1?sp:0)+ww;
  }
  if(line.length) lines.push(line);
  return lines;
}
function drawLine(line, x, y, base=C.fg, f=FS){
  ctx.font=f; const sp=ctx.measureText(' ').width; let cx=x;
  for(const tk of line){ ctx.fillStyle=tk.c||(tk.hl?C.y:base); ctx.fillText(tk.t, Math.round(cx), Math.round(y)); cx+=ctx.measureText(tk.t).width+sp; }
}
function T(s, x, y, c=C.fg, f=FS, align='left'){ ctx.font=f; ctx.fillStyle=c; ctx.textAlign=align; ctx.fillText(s, Math.round(x), Math.round(y)); ctx.textAlign='left'; }
function clip(s, maxW, f=FS){ ctx.font=f; if(ctx.measureText(s).width<=maxW) return s; while(s.length&&ctx.measureText(s+'…').width>maxW) s=s.slice(0,-1); return s+'…'; }
function mix(a,b,t){ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const A=p(a),B=p(b); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }

/* =====================================================================
   PANEL RENDERERS
   ===================================================================== */
function panel([x,y,w,h], fn){ ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip(); ctx.translate(x,y); fn(w,h); ctx.restore(); }
function head(label, live, w){
  T(label, 3, 2, C.y);
  const on = live && (performance.now()/600|0)%2;               // blinking live pixel
  ctx.fillStyle = live===false ? C.bad : on ? C.ok : C.faint;
  ctx.fillRect(w-6, 3, 3, 3);
  ctx.fillStyle=C.faint; ctx.fillRect(3, 12, w-6, 1);
}
function bars(series, x, y, w, h, color){
  const s=series.slice(-w), max=Math.max(...s,1);
  ctx.fillStyle=color;
  s.forEach((v,i)=>{ const bh=Math.max(1,Math.round(v/max*h)); ctx.fillRect(x+w-s.length+i, y+h-bh, 1, bh); });
}
function ticker(lines, top, h, speed, t){              // vertical scrolling loop
  const total=lines.length*LH; if(!total) return;
  const off = total>h ? (t*speed/1000)%total : 0;
  ctx.save(); ctx.beginPath(); ctx.rect(0,top,999,h); ctx.clip();
  for(let pass=0; pass<2; pass++){
    lines.forEach((l,i)=>{ const yy=top+i*LH-off+pass*total; if(yy>top-LH&&yy<top+h) drawLine(l,3,yy); });
    if(total<=h) break;
  }
  ctx.restore();
}

function render(t){
  ctx.clearRect(0,0,W,H);                       // corners stay transparent so the bloom shows
  ctx.fillStyle='#000'; ctx.fillRect(2*U,0,2*U,H); ctx.fillRect(0,3*U,W,2*U);

  /* STATUS — one light per service */
  panel(SLOT.status,(w,h)=>{
    head('STATUS', S.live.status, w);
    S.status.forEach((s,i)=>{
      const y=17+i*12, col= s.ind==='none'?C.ok : s.ind==='minor'?C.warn : C.bad;
      T(s.name, 3, y, C.fg);
      const blink = s.ind!=='none' && (t/400|0)%2;
      ctx.fillStyle = blink ? '#000' : col; ctx.fillRect(w-9, y, 6, 6);
    });
    ctx.fillStyle=C.faint; ctx.fillRect(3, 80, w-6, 1);
    if(S.incLines?.length) ticker(S.incLines, 84, h-86, 6, t);
    else T('ALL CLEAR', 3, 86, C.ok);
  });

  /* AI COMMITS — counters glide between polls */
  panel(SLOT.commits,(w,h)=>{
    head('AI COMMITS', S.live.github, w);
    [['CLAUDE','claude',17],['COPILOT','copilot',95]].forEach(([lab,k,y])=>{
      T(lab, 3, y, C.dim);
      const g=S.gh[k];
      if(!g){ T('—', 3, y+12, C.fg, FBIG); return; }
      const v=g.prev+(g.cur-g.prev)*Math.min(1,(performance.now()-g.t)/90000);
      T(compact(v), 3, y+11, C.fg, FBIG);
      T(fmt(v), 3, y+38, C.y);
      if(g.cur>g.prev) T('+'+fmt(g.cur-g.prev)+'/90s', 3, y+49, C.ok);
    });
  });

  /* HF NEW */
  panel(SLOT.hfNew,(w,h)=>{
    head('HF NEW', S.live.hfNew, w);
    S.hfNew.slice(0,17).forEach((m,i)=>{
      const y=16+i*LH, fresh=m.born?Math.max(0,1-(performance.now()-m.born)/4000):0;
      T(clip(m.name, w-22), 3, y, fresh?mix(C.fg,C.y,fresh):C.fg);
      T(ago(m.created), w-3, y, C.dim, FS, 'right');
    });
  });

  /* HF TRENDING */
  panel(SLOT.hfTrend,(w,h)=>{
    head('HF TREND', S.live.hfTrend, w);
    S.hfTrend.slice(0,17).forEach((m,i)=>{
      const y=16+i*LH;
      T(String(i+1).padStart(2,'0'), 3, y, C.y);
      T(clip(m.name, w-17), 15, y, C.fg);
    });
  });

  /* BLUESKY AI / MIN */
  panel(SLOT.bsky,(w,h)=>{
    head('BLUESKY · AI MENTIONS/MIN', S.bs.live, w);
    T(fmt(S.bs.rate), 3, 17, C.fg, FBIG);
    T(S.bs.pct.toFixed(2)+'% OF '+fmt(S.bs.total)+' POSTS', 3, 44, C.dim);
    bars(S.bs.series, 3, 56, w-6, h-59, C.y);
  });

  /* WIKIPEDIA EDITS / SEC */
  panel(SLOT.wiki,(w,h)=>{
    head('WIKIPEDIA · EDITS/SEC', S.wk.live, w);
    T(String(S.wk.rate), 3, 17, C.fg, FBIG);
    T('AI-TITLED EDITS: '+S.wk.ai, 3, 44, C.dim);
    bars(S.wk.series, 3, 56, w-6, h-59, C.blue);
  });

  /* OPENROUTER — count + marquee of newest models */
  panel(SLOT.or,(w,h)=>{
    head('OPENROUTER · MODELS LIVE', S.live.openrouter, w);
    T(S.or.count?fmt(S.or.count):'—', 3, 17, C.fg, FBIG);
    T('NEWEST ↓', 3, 46, C.dim);
    if(S.or.newest.length){
      const str=S.or.newest.join('   ·   ')+'   ·   ';
      ctx.font=FM; const sw=ctx.measureText(str).width, off=(t*0.025)%sw;
      for(let k=0;k<3;k++) T(str, 3-off+k*sw, 60, C.y, FM);
    }
  });

  /* GRID CARBON */
  panel(SLOT.grid,(w,h)=>{
    head('GRID · gCO2/kWh', S.live.grid, w);
    T(S.grid.val??'—', 3, 17, C.fg, FBIG);
    T(S.grid.idx, w-3, 26, S.grid.idx.includes('HIGH')?C.bad:S.grid.idx.includes('LOW')?C.ok:C.warn, FS, 'right');
    let x=3; const bw=w-6;
    S.grid.mix.forEach(f=>{ const fw=Math.max(1,Math.round(f.perc/100*bw)); ctx.fillStyle=FUEL_C[f.fuel]||'#666'; ctx.fillRect(x,46,Math.min(fw,3+bw-x),10); x+=fw; });
    S.grid.mix.slice(0,4).forEach((f,i)=>{ const cx=3+i*42; ctx.fillStyle=FUEL_C[f.fuel]||'#666'; ctx.fillRect(cx,63,4,4); T(f.fuel.slice(0,4).toUpperCase()+' '+Math.round(f.perc), cx+6, 61, C.dim); });
  });

  /* HACKER NEWS ticker */
  panel(SLOT.hn,(w,h)=>{ head('HACKER NEWS', S.live.hn, w); ticker(S.hnLines, 16, h-16, 7, t); });

  /* LATEST AI COMMITS ticker */
  panel(SLOT.ghList,(w,h)=>{ head('AI COMMITS', S.live.github, w); ticker(S.ghLines, 16, h-16, 7, t); });

  /* LIVE FEEDS — newest on top, flashes yellow on arrival */
  [['bsFeed','BLUESKY · LIVE',S.bsFeed,S.bs.live],['wkFeed','WIKIPEDIA · LIVE',S.wkFeed,S.wk.live]].forEach(([slot,label,feed,live])=>{
    panel(SLOT[slot],(w,h)=>{
      head(label, live, w);
      let y=16;
      for(const it of feed){
        const fresh=Math.max(0,1-(performance.now()-it.born)/2500);
        const base=fresh?mix(C.fg,C.y,fresh):C.fg;
        for(const l of it.lines){ if(y>h) break; drawLine(l,3,y,base); y+=LH; }
        y+=4; if(y>h) break;
        ctx.fillStyle=C.faint; ctx.fillRect(3,y-3,w-6,1);
      }
    });
  });
}

/* ---------- main loop: 30 fps ---------- */
let lastFrame=0;
function loop(t){
  flare*=0.94;
  stage.style.setProperty('--g', (0.9+0.12*Math.sin(t/2600)+Math.min(flare,0.6)).toFixed(3));
  if(t-lastFrame>=33){ lastFrame=t; render(t); }
  requestAnimationFrame(loop);
}
Promise.all([FS,FM,FB,FBIG].map(f=>document.fonts.load(f))).finally(()=>requestAnimationFrame(loop));
</script>
</body>
</html>
